<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tower of Hanoi</title>
  <style>
    :root {
      --bg: #f3efe8;
      --card: #110f0f;
      --ink: #d3560d;
      --mut: #7a6a5a;
      --acc: #c2410c;
      --line: #ece8e7;
      --ok: #15803d;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #1a1511;
        --card: #261f19;
        --ink: #e04a1d;
        --mut: #b3a291;
        --acc: #fb923c;
        --line: #3a3027;
        --ok: #4ade80
      }
    }

    :root[data-theme="dark"] {
      --bg: #1a1511;
      --card: #261f19;
      --ink: #f0f5e2;
      --mut: #b3a291;
      --acc: #fb923c;
      --line: #3a3027;
      --ok: #4ade80
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px
    }

    h1 {
      margin: 4px 0 12px;
      font-size: clamp(22px, 4vw, 32px);
      letter-spacing: .5px
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 12px
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px
    }

    .stat small {
      display: block;
      color: var(--mut);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .8px
    }

    .stat b {
      font-size: 20px;
      font-variant-numeric: tabular-nums
    }

    #status[data-s="Playing"] {
      color: var(--acc)
    }

    #status[data-s="Completed"] {
      color: var(--ok)
    }

    .stage {
      position: relative;
      width: 100%;
      height: clamp(300px, 46vw, 400px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden
    }

    .platform {
      position: absolute;
      left: 2%;
      right: 2%;
      bottom: 0;
      height: 28px;
      border-radius: 8px 8px 0 0;
      background: linear-gradient(#b7793c, #8a5424 60%, #6b3f18);
      box-shadow: 0 -2px 0 #d49a5e inset
    }

    .peg {
      position: absolute;
      bottom: 28px;
      width: 12px;
      margin-left: -6px;
      border-radius: 6px 6px 0 0;
      background: linear-gradient(90deg, #6b3f18, #c8924f, #6b3f18)
    }

    .lbl {
      position: absolute;
      bottom: 4px;
      transform: translateX(-50%);
      font-weight: 700;
      color: #fff;
      font-size: 13px;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px #0006
    }

    .ring {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 999px;
      box-shadow: 0 3px 6px #0004, inset 0 2px 3px #fff6, inset 0 -3px 4px #0003;
      will-change: transform
    }

    .ctl {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      align-items: center
    }

    .grp {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 6px 8px
    }

    .grp span {
      font-size: 11px;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-right: 2px
    }

    button {
      font: inherit;
      font-weight: 600;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 10px;
      padding: 9px 14px;
      cursor: pointer;
      touch-action: manipulation
    }

    button:hover:not(:disabled) {
      border-color: var(--acc)
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    button.pri {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff
    }

    button.on {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    .prog {
      margin-top: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px
    }

    .bar {
      height: 8px;
      background: var(--line);
      border-radius: 6px;
      margin-top: 6px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--ok);
      transition: width .25s
    }

    .ov {
      position: fixed;
      inset: 0;
      background: #000a;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20
    }

    .ov.show {
      display: flex
    }

    .modal {
      background: var(--card);
      border-radius: 18px;
      padding: 26px;
      max-width: 380px;
      width: 100%;
      text-align: center
    }

    .modal h2 {
      margin: 0 0 12px;
      color: var(--ok);
      font-size: 28px
    }

    .modal p {
      margin: 6px 0
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Tower of Hanoi</h1>
    <div class="stats">
      <div class="stat"><small>Moves</small><b id="moves">0</b></div>
      <div class="stat"><small>Minimum</small><b id="min">7</b></div>
      <div class="stat"><small>Time</small><b id="time">0.0s</b></div>
      <div class="stat"><small>Speed</small><b id="speedLbl">Normal</b></div>
      <div class="stat"><small>Status</small><b id="status" data-s="Ready">Ready</b></div>
    </div>
    <div class="stage" id="stage">
      <div class="platform"></div>
    </div>
    <div class="prog"><span id="progTxt">0 / 3 rings on Tower C</span>
      <div class="bar"><i id="progBar"></i></div>
    </div>
    <div class="ctl">
      <button class="pri" id="bSolve">AUTO SOLVE</button>
      <button id="bPause" disabled>PAUSE</button>
      <button id="bResume" disabled>RESUME</button>
      <button id="bReset">RESET</button>
      <button id="bSound" class="on">SOUND ON</button>
    </div>
    <div class="ctl">
      <div class="grp"><span>Disks</span><span id="diskBtns" style="display:contents"></span></div>
      <div class="grp"><span>Speed</span><span id="speedBtns" style="display:contents"></span></div>
    </div>
  </div>
  <div class="ov" id="ov">
    <div class="modal">
      <h2>PUZZLE SOLVED!</h2>
      <p>Total moves: <b id="mMoves"></b></p>
      <p>Minimum possible: <b id="mMin"></b></p>
      <p>Solving time: <b id="mTime"></b></p>
      <p style="margin-top:16px"><button class="pri" id="bAgain">PLAY AGAIN</button></p>
    </div>
  </div>

  <script>
    /* ---------- Sound ---------- */
    const Sound = (() => {
      let ctx = null, enabled = true, last = 0;
      const init = () => { try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) { ctx = null; } };
      const tone = (f, f2, dur, type, vol, when = 0) => {
        if (!ctx || !enabled) return;
        const t = ctx.currentTime + when, o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
      };
      const gate = ms => { const n = performance.now(); if (n - last < ms) return false; last = n; return true; };
      return {
        init,
        setEnabled: v => enabled = v,
        pick() { if (gate(30)) { tone(900, 500, 0.07, 'triangle', 0.18); } },
        drop() { if (gate(30)) { tone(220, 90, 0.16, 'sine', 0.35); tone(1400, 700, 0.04, 'square', 0.05); } },
        win() { last = 0;[523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.002, 0.35, 'triangle', 0.25, i * 0.14)); }
      };
    })();

    /* ---------- Game logic ---------- */
    const Game = {
      n: 3, towers: [[], [], []], moves: 0,
      reset(n) { this.n = n; this.moves = 0; this.towers = [[], [], []]; for (let s = n; s >= 1; s--) this.towers[0].push(s); },
      min() { return Math.pow(2, this.n) - 1; },
      canMove(a, b) { const f = this.towers[a], t = this.towers[b]; return a !== b && f.length > 0 && (t.length === 0 || t[t.length - 1] > f[f.length - 1]); },
      solution(n, from = 0, to = 2, aux = 1, out = []) { // recursive solver
        if (n === 0) return out;
        this.solution(n - 1, from, aux, to, out); out.push([from, to]); this.solution(n - 1, aux, to, from, out);
        return out;
      },
      solved() { return this.towers[2].length === this.n; }
    };

    /* ---------- Animation / view ---------- */
    const $ = id => document.getElementById(id);
    const stage = $('stage');
    const View = {
      rings: {}, pegs: [], geo: null,
      build() {
        stage.querySelectorAll('.ring,.peg,.lbl').forEach(e => e.remove());
        this.rings = {};
        for (let t = 0; t < 3; t++) {
          const p = document.createElement('div'); p.className = 'peg'; stage.appendChild(p);
          const l = document.createElement('div'); l.className = 'lbl'; l.textContent = 'ABC'[t]; stage.appendChild(l);
          this.pegs[t] = { p, l };
        }
        for (let s = Game.n; s >= 1; s--) {
          const r = document.createElement('div'); r.className = 'ring';
          r.style.background = `linear-gradient(180deg,hsl(${(s - 1) * 300 / Math.max(Game.n, 1) + 5} 85% 62%),hsl(${(s - 1) * 300 / Math.max(Game.n, 1) + 5} 80% 42%))`;
          stage.appendChild(r); this.rings[s] = r;
        }
        this.layout();
      },
      layout() {
        const W = stage.clientWidth, H = stage.clientHeight, n = Game.n;
        const base = H - 28, rh = Math.min(28, (H - 80) / (n + 1)), maxW = W / 3 - 14, minW = Math.max(34, maxW * 0.3);
        const cx = [W / 6, W / 2, W * 5 / 6], pegH = (n + 1) * rh + 14;
        this.geo = { W, H, base, rh, cx, lift: Math.max(6, base - pegH - rh - 10) };
        this.pegs.forEach((o, t) => { o.p.style.left = cx[t] + 'px'; o.p.style.height = pegH + 'px'; o.l.style.left = cx[t] + 'px'; });
        for (let s = 1; s <= n; s++) {
          const w = n === 1 ? maxW : minW + (maxW - minW) * (s - 1) / (n - 1), r = this.rings[s];
          r.style.width = w + 'px'; r.style.height = rh - 2 + 'px'; r._w = w;
        }
        for (let t = 0; t < 3; t++) Game.towers[t].forEach((s, k) => this.place(s, cx[t], base - (k + 1) * rh));
      },
      place(s, cx, y) { const r = this.rings[s]; r._x = cx; r._y = y; r.style.transform = `translate(${cx - r._w / 2}px,${y}px)`; },
      yFor(t, level) { return this.geo.base - (level + 1) * this.geo.rh; }
    };

    let runId = 0, busy = false, paused = false, resumeFn = null;
    const speeds = { Slow: 450, Normal: 250, Fast: 120, 'Very Fast': 45 };
    let speedName = 'Normal', solving = false, started = false, completed = false;
    let accMs = 0, t0 = 0;

    const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    function tween(ms, fn, id) {
      return new Promise((res, rej) => {
        const s = performance.now();
        (function f(t) {
          if (id !== runId) return rej('stale');
          const p = Math.min(1, Math.max(0, (t - s) / ms)); fn(ease(p));
          p < 1 ? requestAnimationFrame(f) : res();
        })(s);
      });
    }
    async function moveRing(a, b, id) {
      if (!Game.canMove(a, b)) throw new Error('Illegal move');
      const g = View.geo, s = Game.towers[a].pop(), r = View.rings[s];
      const ms = speeds[speedName], x1 = g.cx[a], x2 = g.cx[b], y1 = r._y, y3 = View.yFor(b, Game.towers[b].length);
      Sound.pick();
      await tween(ms, p => View.place(s, x1, y1 + (g.lift - y1) * p), id);       // 1. up
      await tween(ms * 1.3, p => View.place(s, x1 + (x2 - x1) * p, g.lift), id); // 2. across
      await tween(ms, p => View.place(s, x2, g.lift + (y3 - g.lift) * p), id);   // 3. down
      Game.towers[b].push(s); Game.moves++; Sound.drop(); updateUI();
    }

    /* ---------- Controller ---------- */
    const fmt = ms => (ms / 1000).toFixed(1) + 's';
    const elapsed = () => accMs + (t0 ? performance.now() - t0 : 0);
    function setStatus(s) { const e = $('status'); e.textContent = s; e.dataset.s = s; }
    function updateUI() {
      $('moves').textContent = Game.moves; $('min').textContent = Game.min();
      const c = Game.towers[2].length;
      $('progTxt').textContent = `${c} / ${Game.n} rings on Tower C`; $('progBar').style.width = (c / Game.n * 100) + '%';
      $('bSolve').disabled = solving || completed || started;
      $('bPause').disabled = !solving || paused;
      $('bResume').disabled = !solving || !paused;
    }
    setInterval(() => { $('time').textContent = fmt(elapsed()); }, 100);

    function fullReset(n = Game.n) {
      runId++; busy = false; paused = false; solving = false; started = false; completed = false; accMs = 0; t0 = 0;
      if (resumeFn) { resumeFn(); resumeFn = null; }
      $('ov').classList.remove('show');
      Game.reset(n); View.build(); setStatus('Ready'); updateUI();
      document.querySelectorAll('#diskBtns button').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
    }

    async function autoSolve() {
      if (solving || completed || started) return;
      Sound.init();
      const id = ++runId, list = Game.solution(Game.n);
      solving = true; started = true; paused = false; busy = true; t0 = performance.now(); setStatus('Playing'); updateUI();
      try {
        for (const [a, b] of list) {
          if (paused) await new Promise(r => resumeFn = r);
          if (id !== runId) return;
          await moveRing(a, b, id);
          await new Promise(r => setTimeout(r, speeds[speedName] * 0.25));
          if (id !== runId) return;
        }
        if (id !== runId) return;
        accMs = elapsed(); t0 = 0; solving = false; busy = false; completed = Game.solved();
        setStatus('Completed'); updateUI(); Sound.win();
        $('mMoves').textContent = Game.moves; $('mMin').textContent = Game.min(); $('mTime').textContent = fmt(accMs);
        $('ov').classList.add('show');
      } catch (e) { if (e !== 'stale') { console.error(e); solving = false; busy = false; setStatus('Ready'); updateUI(); } }
    }
    function pause() {
      if (!solving || paused) return;
      paused = true; accMs = elapsed(); t0 = 0; setStatus('Paused'); updateUI();
    }
    function resume() {
      if (!solving || !paused) return;
      Sound.init(); paused = false; t0 = performance.now(); setStatus('Playing'); updateUI();
      if (resumeFn) { const f = resumeFn; resumeFn = null; f(); }
    }

    /* ---------- Wiring ---------- */
    $('bSolve').onclick = autoSolve;
    $('bPause').onclick = pause;
    $('bResume').onclick = resume;
    $('bReset').onclick = () => { Sound.init(); fullReset(); };
    $('bAgain').onclick = () => fullReset();
    $('bSound').onclick = e => {
      Sound.init(); const on = !e.target.classList.contains('on');
      e.target.classList.toggle('on', on); e.target.textContent = on ? 'SOUND ON' : 'SOUND OFF'; Sound.setEnabled(on);
    };
    for (let n = 3; n <= 8; n++) {
      const b = document.createElement('button'); b.textContent = n; b.dataset.n = n;
      b.onclick = () => fullReset(n); $('diskBtns').appendChild(b);
    }
    Object.keys(speeds).forEach(k => {
      const b = document.createElement('button'); b.textContent = k; b.dataset.k = k;
      b.onclick = () => {
        speedName = k; $('speedLbl').textContent = k;
        document.querySelectorAll('#speedBtns button').forEach(x => x.classList.toggle('on', x === b));
      };
      if (k === speedName) b.classList.add('on');
      $('speedBtns').appendChild(b);
    });
    window.addEventListener('resize', () => { if (!busy || paused) View.layout(); });
    window.addEventListener('pointerdown', () => Sound.init(), { once: true });
    fullReset(3);
  </script>
</body>

</html>
